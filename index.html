      /* Planta & Raiz DNA Colors */
      :root {
        --color-primary: #0A0E27;
        --color-secondary: #1a1f3a;
        --color-accent: #00FF00;
        --color-accent-light: #39FF14;
        --color-purple: #9D4EDD;
        --color-white: #FFFFFF;
        --color-gray: #9CA3AF;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: var(--color-primary );
        color: var(--color-white);
        line-height: 1.6;
      }

      /* Skip to Content Link */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border-width: 0;
      }

      .sr-only:focus {
        position: fixed;
        top: 1rem;
        left: 1rem;
        z-index: 100;
        width: auto;
        height: auto;
        padding: 0.5rem 1rem;
        margin: 0;
        overflow: visible;
        clip: auto;
        white-space: normal;
        border-radius: 0.75rem;
        background-color: var(--color-accent);
        color: var(--color-primary);
        font-weight: bold;
        font-size: 0.875rem;
        outline: none;
        box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      ::-webkit-scrollbar-track {
        background: var(--color-secondary);
      }

      ::-webkit-scrollbar-thumb {
        background: var(--color-accent);
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--color-accent-light);
      }

      /* Selection */
      ::selection {
        background-color: var(--color-accent);
        color: var(--color-primary);
      }

      /* Full screen usage */
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }

      #root {
        min-height: 100vh;
        min-height: 100dvh;
        width: 100%;
      }
    </style>
