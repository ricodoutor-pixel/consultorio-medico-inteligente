version: 1

# Configuração de Build para Hostinger
build:
  # Comando de build
  command: "npm install --legacy-peer-deps --prefer-offline --no-audit && npm run build"
  
  # Diretório de saída
  outputDirectory: "dist"
  
  # Node version
  nodeVersion: "20.x"
  
  # Timeout (30 minutos)
  timeout: 1800
  
  # Memória máxima
  memory: "2048"

# Variáveis de ambiente
env:
  NODE_ENV: "production"
  NODE_OPTIONS: "--max-old-space-size=2048"
  VITE_APP_TITLE: "Planta & Raiz"
  VITE_SUPABASE_PROJECT_ID: "shmbwdjuddvquszwkvuq"
  VITE_SUPABASE_URL: "https://shmbwdjuddvquszwkvuq.supabase.co"
  VITE_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNobWJ3ZGp1ZGR2cXVzendrdnVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyOTE4MDksImV4cCI6MjA4Nzg2NzgwOX0.wGL0NQi2gKWyiC4L1ca1xxzSvEbvq2Uc8jvM7XOH9xQ"

# Cache
cache:
  enabled: true
  directories:
    - "node_modules"
    - ".vite"
    - "dist"

# Retries
retries: 3

# Logs
logs:
  level: "info"
  verbose: true
