name: CI e Monitoramento

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.app.json

      - name: Lint
        run: bunx eslint . --max-warnings 0
        continue-on-error: true

      - name: Build
        run: bun run build

      - name: Guard contra dados pessoais versionados
        run: |
          set -e
          BAD=$(git ls-files | grep -E '(contatos_|contacts_to_send|mined_doctor_leads|prescritores_|lista_500_medicos|campaign_log_|dispatch_log|email_sent_state|invites_sent_state|whatsapp_session/|\.env\.(production|development)$|dist\.tar\.gz)' || true)
          if [ -n "$BAD" ]; then
            echo "Arquivos com dados pessoais ou artefatos nao devem ser versionados:"
            echo "$BAD"
            exit 1
          fi
          echo "OK: nenhum arquivo sensivel versionado."
