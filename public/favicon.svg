<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Verdinho Head Only - Full Size Favicon -->
  <!-- Green head background -->
  <circle cx="32" cy="32" r="30" fill="#22c55e"/>
  <!-- Left eye white -->
  <circle cx="20" cy="24" r="11" fill="white"/>
  <!-- Right eye white -->
  <circle cx="44" cy="24" r="11" fill="white"/>
  <!-- Left pupil -->
  <circle cx="21" cy="24" r="6" fill="#1a1a2e"/>
  <!-- Right pupil -->
  <circle cx="45" cy="24" r="6" fill="#1a1a2e"/>
  <!-- Left eye shine -->
  <circle cx="23" cy="21" r="2.5" fill="white"/>
  <!-- Right eye shine -->
  <circle cx="47" cy="21" r="2.5" fill="white"/>
  <!-- Big smile -->
  <path d="M14 42 Q32 58 50 42" stroke="#1a1a2e" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Nostrils -->
  <circle cx="27" cy="34" r="1.5" fill="#1a8a3e"/>
  <circle cx="37" cy="34" r="1.5" fill="#1a8a3e"/>
</svg>
