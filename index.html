    <style>
      :root {
        --color-primary: #0A0E27;
        --color-secondary: #1a1f3a;
        --color-tertiary: #2d3748;
        --color-accent: #00FF00;
        --color-accent-light: #39FF14;
        --color-accent-dark: #00CC00;
        --color-purple: #9D4EDD;
        --color-cyan: #00D9FF;
        --color-white: #FFFFFF;
        --color-gray: #9CA3AF;
        --color-gray-dark: #6B7280;
        --color-success: #10B981;
        --color-warning: #F59E0B;
        --color-error: #EF4444;
        --color-info: #3B82F6;
        
        /* Spacing */
        --spacing-xs: 0.25rem;
        --spacing-sm: 0.5rem;
        --spacing-md: 1rem;
        --spacing-lg: 1.5rem;
        --spacing-xl: 2rem;
        --spacing-2xl: 3rem;
        
        /* Border Radius */
        --radius-sm: 0.375rem;
        --radius-md: 0.5rem;
        --radius-lg: 0.75rem;
        --radius-xl: 1rem;
        --radius-2xl: 1.5rem;
        
        /* Shadows */
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        --shadow-neon: 0 0 20px rgba(0, 255, 0, 0.3);
        
        /* Z-Index */
        --z-dropdown: 1000;
        --z-sticky: 1020;
        --z-fixed: 1030;
        --z-modal-backdrop: 1040;
        --z-modal: 1050;
        --z-popover: 1060;
        --z-tooltip: 1070;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      html {
        scroll-behavior: smooth;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: var(--color-primary);
        color: var(--color-white);
        line-height: 1.6;
        overflow-x: hidden;
      }

      .sr-only {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border-width: 0;
      }

      .sr-only:focus {
        position: fixed; 
        top: 1rem; 
        left: 1rem; 
        z-index: var(--z-tooltip);
        width: auto; 
        height: auto; 
        padding: 0.5rem 1rem; 
        margin: 0;
        overflow: visible; 
        clip: auto; 
        white-space: normal;
        border-radius: var(--radius-lg); 
        background-color: var(--color-accent);
        color: var(--color-primary); 
        font-weight: bold; 
        font-size: 0.875rem;
        outline: none; 
        box-shadow: var(--shadow-neon);
      }

      /* Scrollbar */
      ::-webkit-scrollbar { 
        width: 8px; 
        height: 8px; 
      }
      
      ::-webkit-scrollbar-track { 
        background: var(--color-secondary); 
      }
      
      ::-webkit-scrollbar-thumb { 
        background: var(--color-accent); 
        border-radius: 4px; 
      }
      
      ::-webkit-scrollbar-thumb:hover { 
        background: var(--color-accent-light); 
      }

      /* Selection */
      ::selection { 
        background-color: var(--color-accent); 
        color: var(--color-primary); 
      }

      /* Layout */
      html, body { 
        width: 100%; 
        height: 100%; 
        overflow-x: hidden; 
      }
      
      #root { 
        min-height: 100vh; 
        min-height: 100dvh; 
        width: 100%; 
      }

      /* Animations */
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes slideInUp {
        from { 
          opacity: 0; 
          transform: translateY(20px); 
        }
        to { 
          opacity: 1; 
          transform: translateY(0); 
        }
      }

      @keyframes slideInDown {
        from { 
          opacity: 0; 
          transform: translateY(-20px); 
        }
        to { 
          opacity: 1; 
          transform: translateY(0); 
        }
      }

      @keyframes slideInLeft {
        from { 
          opacity: 0; 
          transform: translateX(-20px); 
        }
        to { 
          opacity: 1; 
          transform: translateX(0); 
        }
      }

      @keyframes slideInRight {
        from { 
          opacity: 0; 
          transform: translateX(20px); 
        }
        to { 
          opacity: 1; 
          transform: translateX(0); 
        }
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }

      @keyframes glow {
        0%, 100% { 
          box-shadow: 0 0 20px rgba(0, 255, 0, 0.3); 
        }
        50% { 
          box-shadow: 0 0 40px rgba(0, 255, 0, 0.6); 
        }
      }

      /* Utility Classes */
      .fade-in {
        animation: fadeIn 0.3s ease-in-out;
      }

      .slide-in-up {
        animation: slideInUp 0.3s ease-out;
      }

      .slide-in-down {
        animation: slideInDown 0.3s ease-out;
      }

      .slide-in-left {
        animation: slideInLeft 0.3s ease-out;
      }

      .slide-in-right {
        animation: slideInRight 0.3s ease-out;
      }

      .pulse {
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      .glow {
        animation: glow 2s ease-in-out infinite;
      }

      /* Glassmorphism */
      .glass {
        background: rgba(26, 31, 58, 0.7);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(0, 255, 0, 0.1);
        border-radius: var(--radius-xl);
      }

      .glass-sm {
        background: rgba(26, 31, 58, 0.5);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(0, 255, 0, 0.05);
        border-radius: var(--radius-lg);
      }

      /* Gradients */
      .gradient-primary {
        background: linear-gradient(135deg, var(--color-accent) 0%, var(--color-cyan) 100%);
      }

      .gradient-secondary {
        background: linear-gradient(135deg, var(--color-purple) 0%, var(--color-accent) 100%);
      }

      .gradient-text {
        background: linear-gradient(135deg, var(--color-accent) 0%, var(--color-cyan) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
    </style>

    <!-- Monitoring & Analytics -->
    <script>
      // Performance Monitoring
      if (window.PerformanceObserver) {
        const observer = new PerformanceObserver((list) => {
          for (const entry of list.getEntries()) {
            if (entry.entryType === 'navigation') {
              gtag('event', 'page_load', {
                'page_path': window.location.pathname,
                'page_title': document.title,
                'ttfb': entry.responseStart - entry.fetchStart,
                'fcp': entry.domContentLoadedEventEnd - entry.fetchStart
              });
            }
          }
        });
        observer.observe({ entryTypes: ['navigation', 'paint', 'largest-contentful-paint'] });
      }

      // Error Tracking
      window.addEventListener('error', (event) => {
        gtag('event', 'exception', {
          'description': event.message,
          'fatal': false
        });
      });

      // Unhandled Promise Rejection Tracking
      window.addEventListener('unhandledrejection', (event) => {
        gtag('event', 'exception', {
          'description': event.reason,
          'fatal': false
        });
      });
    </script>

        window.addEventListener('load', () => {

          });
        });

    <!-- Monitoring Script -->
    <script>
      // Send performance metrics to monitoring system
      window.addEventListener('load', () => {
        if (window.performance && window.performance.timing) {
          const perfData = window.performance.timing;
          const pageLoadTime = perfData.loadEventEnd - perfData.navigationStart;
          
          // Send to Prometheus/Grafana
          fetch('/api/metrics/page-load', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              page: window.location.pathname,
              loadTime: pageLoadTime,
              timestamp: new Date().toISOString()
            })
          }).catch(() => {
            // Metrics endpoint not available, continue normally
          });
        }
      });
    </script>
