    <style>
      :root {
        /* Cores Primárias */
        --color-primary: #0A0E27;
        --color-secondary: #1a1f3a;
        --color-tertiary: #2d3748;
        
        /* Cores de Acento */
        --color-accent: #00FF00;
        --color-accent-light: #39FF14;
        --color-accent-dark: #00CC00;
        --color-cyan: #00D9FF;
        --color-purple: #9D4EDD;
        
        /* Cores Neutras */
        --color-white: #FFFFFF;
        --color-gray-50: #F9FAFB;
        --color-gray-100: #F3F4F6;
        --color-gray-200: #E5E7EB;
        --color-gray-400: #9CA3AF;
        --color-gray-600: #4B5563;
        --color-gray-800: #1F2937;
        
        /* Cores de Status */
        --color-success: #10B981;
        --color-warning: #F59E0B;
        --color-danger: #FF3131;
        --color-error: #EF4444;
        --color-info: #3B82F6;
        
        /* Spacing */
        --spacing-xs: 0.25rem;
        --spacing-sm: 0.5rem;
        --spacing-md: 1rem;
        --spacing-lg: 1.5rem;
        --spacing-xl: 2rem;
        --spacing-2xl: 3rem;
        
        /* Border Radius */
        --radius-sm: 0.375rem;
        --radius-md: 0.5rem;
        --radius-lg: 0.75rem;
        --radius-xl: 1rem;
        --radius-2xl: 1.5rem;
        --radius-full: 9999px;
        
        /* Shadows */
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        --shadow-neon: 0 0 20px rgba(0, 255, 0, 0.2);
        --shadow-neon-cyan: 0 0 20px rgba(0, 217, 255, 0.2);
        --shadow-neon-purple: 0 0 20px rgba(157, 78, 221, 0.2);
        
        /* Z-Index */
        --z-dropdown: 1000;
        --z-sticky: 1020;
        --z-fixed: 1030;
        --z-modal-backdrop: 1040;
        --z-modal: 1050;
        --z-popover: 1060;
        --z-tooltip: 1070;
        
        /* Transições */
        --transition-fast: 150ms ease-in-out;
        --transition-base: 200ms ease-in-out;
        --transition-slow: 300ms ease-in-out;
      }

      /* CORREÇÃO CRÍTICA: Impedir overflow em iOS/Android */
      html, body {
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
        margin: 0;
        padding: 0;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background-color: var(--color-primary);
        color: var(--color-white);
        line-height: 1.6;
        overflow-x: hidden;
        letter-spacing: -0.5px;
      }

      /* Acessibilidade */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }

      /* SELO CONFORMIDADE - Topo */
      .compliance-tag {
        width: 100%;
        text-align: center;
        background: var(--color-secondary);
        padding: var(--spacing-sm) 0;
        font-size: 0.7rem;
        letter-spacing: 1px;
        color: var(--color-accent);
        border-bottom: 1px solid rgba(0, 255, 0, 0.1);
      }

      /* HEADER MEGA HUB OTIMIZADO */
      .mega-header {
        width: 100%;
        padding: 15px 5%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(10, 14, 39, 0.95);
        backdrop-filter: blur(10px);
        position: sticky;
        top: 0;
        z-index: var(--z-sticky);
        border-bottom: 1px solid rgba(0, 255, 0, 0.2);
        gap: var(--spacing-md);
      }

      /* Logo Box */
      .logo-box {
        display: flex;
        align-items: center;
        gap: var(--spacing-md);
        flex: 1;
      }

      .logo-box img {
        height: 40px;
        width: auto;
        object-fit: contain;
      }

      .logo-box span {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 1.2rem;
        line-height: 1.2;
      }

      .logo-box small {
        font-size: 0.6rem;
        color: var(--color-accent);
        display: block;
      }

      /* Navigation Links */
      .nav-links {
        display: flex;
        gap: var(--spacing-xl);
        align-items: center;
        margin-right: auto;
      }

      .nav-links a {
        color: var(--color-white);
        text-decoration: none;
        transition: color var(--transition-base);
      }

      .nav-links a:hover {
        color: var(--color-accent);
      }

      .lang-icon {
        cursor: pointer;
        font-size: 1.2rem;
        transition: transform var(--transition-base);
      }

      .lang-icon:hover {
        transform: scale(1.1);
      }

      /* BOTÃO INICIAR CONSULTA - Otimizado para Mobile */
      .btn-iniciar {
        background: var(--color-accent);
        color: var(--color-primary);
        padding: 10px 18px;
        border-radius: var(--radius-full);
        font-weight: 800;
        text-decoration: none;
        font-size: 0.85rem;
        text-transform: uppercase;
        box-shadow: 0 0 15px rgba(0, 255, 0, 0.4);
        transition: all var(--transition-base);
        border: none;
        cursor: pointer;
        white-space: nowrap;
        display: inline-block;
      }

      .btn-iniciar:hover {
        background: var(--color-accent-light);
        box-shadow: 0 0 25px rgba(0, 255, 0, 0.6);
        transform: translateY(-2px);
      }

      .btn-iniciar:active {
        transform: translateY(0);
      }

      /* STATUS MÉDICO - Indicador Online/Offline */
      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
        margin-right: 5px;
      }

      .status-dot.online {
        background: var(--color-accent);
        box-shadow: 0 0 8px var(--color-accent);
        animation: blink 1.5s infinite;
      }

      .status-dot.offline {
        background: var(--color-danger);
      }

      /* ANIMAÇÕES */
      @keyframes blink {
        0% { opacity: 1; }
        50% { opacity: 0.4; }
        100% { opacity: 1; }
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes slideUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }

      .animate-fade-in {
        animation: fadeIn 0.5s ease-in-out;
      }

      .animate-slide-up {
        animation: slideUp 0.5s ease-in-out;
      }

      /* Glassmorphism */
      .glass {
        background: rgba(26, 31, 58, 0.7);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(0, 255, 0, 0.1);
        border-radius: var(--radius-xl);
      }

      /* Gradientes */
      .gradient-text {
        background: linear-gradient(135deg, var(--color-accent) 0%, var(--color-cyan) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* Scrollbar Customizado */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      ::-webkit-scrollbar-track {
        background: var(--color-secondary);
      }

      ::-webkit-scrollbar-thumb {
        background: var(--color-accent);
        border-radius: 10px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--color-accent-light);
      }

      /* Placeholder */
      ::placeholder {
        color: var(--color-gray-400);
      }

      /* Selection */
      ::selection {
        background-color: var(--color-accent);
        color: var(--color-primary);
      }

      /* RESPONSIVIDADE */
      @media (max-width: 768px) {
        .mega-header {
          padding: 12px 3%;
        }

        .logo-box span {
          font-size: 1rem;
        }

        .nav-links {
          display: none;
        }

        .btn-iniciar {
          padding: 8px 14px;
          font-size: 0.75rem;
        }

        :root {
          --spacing-xl: 1.5rem;
          --spacing-2xl: 2rem;
        }
      }

      @media (max-width: 480px) {
        .mega-header {
          padding: 10px 2%;
        }

        .logo-box {
          gap: var(--spacing-sm);
        }

        .logo-box img {
          height: 32px;
        }

        .logo-box span {
          font-size: 0.9rem;
        }

        .btn-iniciar {
          padding: 8px 12px;
          font-size: 0.7rem;
        }
      }

      /* Reduzir movimento para acessibilidade */
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* Dark mode nativo */
      @media (prefers-color-scheme: dark) {
        body {
          background-color: var(--color-primary);
          color: var(--color-white);
        }
      }
    </style>
  </head>

    <!-- Manus CEO: Auditoria de Dispositivos e Otimização -->
    <script>
      // Detecção de Dispositivo
      window.addEventListener('load', function() {
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        const isTablet = /iPad|Android(?!.*Mobile)/i.test(navigator.userAgent);
        
        console.log('Manus CEO: Dispositivo detectado -', {
          isMobile,
          isTablet,
          userAgent: navigator.userAgent.substring(0, 50)
        });

        // Ajuste de Layout para Desktop
        if (window.innerWidth > 1024) {
          const navLinks = document.querySelector('.nav-links');
          if (navLinks) {
            navLinks.style.marginRight = '50px';
          }
        }

        // Performance Monitoring
        if ('connection' in navigator) {
          const connection = navigator.connection;
          console.log('Conexão:', {
            type: connection.effectiveType,
            downlink: connection.downlink,
            rtt: connection.rtt
          });
        }

        // Web Vitals Tracking
        if ('PerformanceObserver' in window) {
          try {
            const observer = new PerformanceObserver((list) => {
              for (const entry of list.getEntries()) {
                console.log('Performance:', entry.name, entry.duration);
              }
            });
            observer.observe({ entryTypes: ['navigation', 'resource', 'paint'] });
          } catch (e) {
            console.warn('Performance Observer não suportado');
          }
        }
      });

      // Service Worker Registration
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then((registration) => {
              console.log('Service Worker registrado:', registration);
            })
            .catch((error) => {
              console.warn('Erro ao registrar Service Worker:', error);
            });
        });
      }

      // Error Tracking
      window.addEventListener('error', (event) => {
        console.error('Erro Global:', event.error);
        if (navigator.sendBeacon) {
          navigator.sendBeacon('/metrics/error', JSON.stringify({
            timestamp: new Date().toISOString(),
            message: event.message,
            filename: event.filename,
            lineno: event.lineno
          }));
        }
      });

      // Unhandled Promise Rejection
      window.addEventListener('unhandledrejection', (event) => {
        console.error('Promise Rejection:', event.reason);
      });

      // Language Switcher
      document.getElementById('lang-icon').addEventListener('click', function() {
        const currentLang = this.textContent.includes('PT') ? 'PT' : 'EN';
        const newLang = currentLang === 'PT' ? 'EN' : 'PT';
        this.textContent = '🌐 ' + newLang;
        console.log('Idioma alterado para:', newLang);
      });

      // Keyboard Navigation
      document.getElementById('lang-icon').addEventListener('keypress', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          this.click();
        }
      });
    </script>
