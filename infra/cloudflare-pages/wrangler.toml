# ⚡ Cloudflare Pages — Frontend Planta y Raiz
# Build config: Vite (React 18 + TypeScript)

[build]
command = "npm install --legacy-peer-deps && npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "20"

# SPA routing — qualquer rota não-asset cai em index.html
# (Cloudflare Pages lê o _redirects de public/ automaticamente após build.)
