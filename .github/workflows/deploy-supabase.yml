# 🌿 Planta y Raiz — Deploy Automático Supabase Edge Functions
#
# FONTE ÚNICA DA VERDADE: o projeto de PRODUÇÃO é `shmbwdjuddvquszwkvuq`.
# O projeto `tkxxoghzhvhjzdoomgss` é LEGADO e NÃO recebe deploys/migrações.
#
# SECRETS necessários (Settings → Secrets → Actions):
#   SUPABASE_ACCESS_TOKEN    → supabase.com → Account → Access Tokens
#   SUPABASE_PROJECT_ID      → (opcional) deve ser shmbwdjuddvquszwkvuq
#   GEMINI_API_KEY / LOVABLE_API_KEY
#   WAHA_API_URL / WAHA_API_KEY
#   ADMIN_PHONE_BR           → ex: 5511987131241
#   EVOLUTION_API_URL / EVOLUTION_API_KEY / EVOLUTION_INSTANCE / EVOLUTION_WEBHOOK_SECRET

name: 🌿 Deploy Supabase → Edge Functions (Produção)

on:
  push:
    branches: [main]
    paths:
      - supabase/functions/**
      - supabase/migrations/**
      - .github/workflows/deploy-supabase.yml
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

env:
  PROD_PROJECT_REF: shmbwdjuddvquszwkvuq
  LEGACY_PROJECT_REF: tkxxoghzhvhjzdoomgss

jobs:
  deploy:
    name: 🚀 Deploy Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Resolver e validar projeto de produção
        id: target
        run: |
          REF="${{ secrets.SUPABASE_PROJECT_ID }}"
          [ -z "$REF" ] && REF="${{ env.PROD_PROJECT_REF }}"
          if [ "$REF" = "${{ env.LEGACY_PROJECT_REF }}" ]; then
            echo "❌ SUPABASE_PROJECT_ID aponta para o projeto LEGADO. Deploy abortado."
            exit 1
          fi
          if [ "$REF" != "${{ env.PROD_PROJECT_REF }}" ]; then
            echo "❌ Projeto ($REF) diferente da produção oficial (${{ env.PROD_PROJECT_REF }}). Deploy abortado."
            exit 1
          fi
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "❌ SUPABASE_ACCESS_TOKEN ausente"
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "✅ Alvo de deploy: $REF"

      - name: Conferir config.toml
        run: |
          grep -q 'project_id = "${{ env.PROD_PROJECT_REF }}"' supabase/config.toml \
            || { echo "❌ supabase/config.toml não aponta para a produção oficial"; exit 1; }
          echo "✅ config.toml consistente"

      - name: Sincronizar secrets nas Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase secrets set \
            GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            LOVABLE_API_KEY="${{ secrets.LOVABLE_API_KEY }}" \
            EVOLUTION_API_URL="${{ secrets.EVOLUTION_API_URL }}" \
            EVOLUTION_API_KEY="${{ secrets.EVOLUTION_API_KEY }}" \
            EVOLUTION_INSTANCE="${{ secrets.EVOLUTION_INSTANCE }}" \
            EVOLUTION_WEBHOOK_SECRET="${{ secrets.EVOLUTION_WEBHOOK_SECRET }}" \
            WAHA_API_URL="${{ secrets.WAHA_API_URL }}" \
            WAHA_API_KEY="${{ secrets.WAHA_API_KEY }}" \
            ADMIN_PHONE_BR="${{ secrets.ADMIN_PHONE_BR }}" \
            JITSI_DOMAIN="meet.jit.si" \
            --project-ref "${{ steps.target.outputs.ref }}"
          echo "✅ Secrets sincronizados"

      # IMPORTANTE: sem --no-verify-jwt global. A verificação de JWT de cada função
      # é definida em supabase/config.toml (verify_jwt), preservando as protegidas.
      - name: Deploy — Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          REF="${{ steps.target.outputs.ref }}"
          FAILED=""
          for dir in supabase/functions/*/; do
            fn=$(basename "$dir")
            case "$fn" in
              _*|*test*|*_temp*) echo "  ⏭️  $fn (ignorada)"; continue ;;
            esac
            [ -f "$dir/index.ts" ] || continue
            echo "  → $fn"
            supabase functions deploy "$fn" --project-ref "$REF" 2>&1 | tail -3 || FAILED="$FAILED $fn"
          done
          if [ -n "$FAILED" ]; then
            echo "❌ Falharam:$FAILED"
            exit 1
          fi
          echo "✅ Edge Functions deployadas"

      - name: Health check — WAHA
        if: always()
        run: |
          WAHA="https://${{ secrets.WAHA_API_URL }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "X-Api-Key: ${{ secrets.WAHA_API_KEY }}" \
            "${WAHA}/api/sessions" 2>/dev/null || echo "000")
          [ "$STATUS" = "200" ] && echo "✅ WAHA online" || echo "⚠️ WAHA HTTP $STATUS"

      - name: Sumário do deploy
        if: always()
        run: |
          {
            echo "## 🌿 Deploy Planta y Raiz"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Status | ${{ job.status }} |"
            echo "| Projeto | \`${{ env.PROD_PROJECT_REF }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
          } >> $GITHUB_STEP_SUMMARY
