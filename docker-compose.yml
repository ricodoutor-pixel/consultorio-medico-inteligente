version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: planta-raiz-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-planta_raiz}
      MYSQL_USER: ${MYSQL_USER:-planta}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-planta123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - planta-raiz-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: planta-raiz-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 3s
      retries: 5
    networks:
      - planta-raiz-network

  # Planta & Raiz Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: planta-raiz-app
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: mysql://${MYSQL_USER:-planta}:${MYSQL_PASSWORD:-planta123}@mysql:3306/${MYSQL_DATABASE:-planta_raiz}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      VITE_APP_ID: ${VITE_APP_ID}
      OAUTH_SERVER_URL: ${OAUTH_SERVER_URL}
      VITE_OAUTH_PORTAL_URL: ${VITE_OAUTH_PORTAL_URL}
      BUILT_IN_FORGE_API_URL: ${BUILT_IN_FORGE_API_URL}
      BUILT_IN_FORGE_API_KEY: ${BUILT_IN_FORGE_API_KEY}
      VITE_FRONTEND_FORGE_API_URL: ${VITE_FRONTEND_FORGE_API_URL}
      VITE_FRONTEND_FORGE_API_KEY: ${VITE_FRONTEND_FORGE_API_KEY}
      # Mercado Pago
      MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN}
      MERCADO_PAGO_PUBLIC_KEY: ${MERCADO_PAGO_PUBLIC_KEY}
      # Twilio
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER}
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - planta-raiz-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PhpMyAdmin (opcional, para gerenciamento de BD)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: planta-raiz-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: ${MYSQL_USER:-planta}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-planta123}
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - planta-raiz-network

  # Redis Commander (opcional, para gerenciamento de cache)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: planta-raiz-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - planta-raiz-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  planta-raiz-network:
    driver: bridge
