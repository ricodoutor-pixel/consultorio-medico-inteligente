services:
  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:80"
    volumes:
      - /var/www/plantayraiz/dist:/usr/share/nginx/html:ro
      - /docker/plantayraiz-web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`plantayraiz.com.br`) || Host(`www.plantayraiz.com.br`) || Host(`srv2036020.hstgr.cloud`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.services.web.loadbalancer.server.port=80"
