name: 🚀 Production Deploy - Planta & Raiz

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'server/**'
      - 'drizzle/**'
      - 'package.json'
      - 'tsconfig.json'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: '22.13.0'

jobs:
  # ============================================
  # 1. TESTES
  # ============================================
  test:
    name: 🧪 Executar Testes
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: plantaraiz_test
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      
      - name: Install pnpm
        run: npm install -g pnpm@10.4.1
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run unit tests
        run: pnpm test
        env:
          DATABASE_URL: mysql://root:root@localhost:3306/plantaraiz_test
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json

  # ============================================
  # 2. SEGURANÇA
  # ============================================
  security:
    name: 🔒 Verificações de Segurança
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      
      - name: Install pnpm
        run: npm install -g pnpm@10.4.1
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run security audit
        run: pnpm audit --audit-level=moderate || true
      
      - name: Run ESLint
        run: pnpm lint || true
      
      - name: Check TypeScript
        run: pnpm check

  # ============================================
  # 3. BUILD
  # ============================================
  build:
    name: 🏗️ Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, security]
    permissions:
      contents: read
      packages: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # 4. DEPLOY
  # ============================================
  deploy:
    name: 🚀 Deploy para Produção
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Manus Cloud
        env:
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
          MANUS_PROJECT_ID: ${{ secrets.MANUS_PROJECT_ID }}
        run: |
          echo "🚀 Iniciando deploy para Manus Cloud..."
          # Usar manus CLI para deploy
          # manus deploy --project=${{ secrets.MANUS_PROJECT_ID }}
          echo "✅ Deploy iniciado com sucesso"
      
      - name: Health Check
        run: |
          echo "🏥 Executando health check..."
          sleep 30
          curl -f https://plantaraiz.com.br/health || exit 1
          echo "✅ Health check passou"
      
      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "🚀 Planta & Raiz Deploy",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deploy Status*\n${{ job.status }}\n\nCommit: ${{ github.sha }}\nAutor: ${{ github.actor }}"
                  }
                }
              ]
            }

  # ============================================
  # 5. MONITORAMENTO
  # ============================================
  monitor:
    name: 📊 Monitoramento Pós-Deploy
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Check API Response Time
        run: |
          echo "⏱️ Verificando tempo de resposta da API..."
          for i in {1..5}; do
            time curl -s https://plantaraiz.com.br/api/health > /dev/null
            sleep 2
          done
      
      - name: Check Database Connection
        run: |
          echo "🗄️ Verificando conexão com banco de dados..."
          # Adicionar verificação de BD aqui
      
      - name: Monitor Error Rates
        run: |
          echo "🚨 Monitorando taxa de erros..."
          # Integrar com serviço de monitoramento (Sentry, DataDog, etc)
      
      - name: Performance Baseline
        run: |
          echo "📈 Verificando baseline de performance..."
          # Executar testes de performance

  # ============================================
  # 6. ROLLBACK (se necessário)
  # ============================================
  rollback:
    name: ⏮️ Rollback (se falhar)
    runs-on: ubuntu-latest
    needs: [deploy, monitor]
    if: failure()
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Get Previous Release
        id: previous
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "main")
          echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
      
      - name: Rollback to Previous Version
        env:
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
        run: |
          echo "⏮️ Fazendo rollback para versão anterior..."
          # manus rollback --tag=${{ steps.previous.outputs.previous_tag }}
          echo "✅ Rollback concluído"
      
      - name: Notify Team
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "⚠️ ROLLBACK EXECUTADO",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deploy falhou e foi feito rollback*\n\nCommit: ${{ github.sha }}\nAutor: ${{ github.actor }}"
                  }
                }
              ]
            }
